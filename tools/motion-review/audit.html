<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>ロキ 画像アニメーション自動検品</title><link rel="stylesheet" href="audit.css"></head><body><header><h1>画像アニメーション 自動検品</h1><p id="origin"></p><p id="counts"></p><p id="limits"></p></header><main><section class="controls"><label>検出結果<select id="state"><option value="all">すべて</option><option value="review">要確認候補</option><option value="error">データエラー</option><option value="no_flags">自動検出なし（合格ではありません）</option></select></label><label>種類<select id="kind"><option value="all">全身・顔・反応順</option><option value="body">全身</option><option value="face">顔</option><option value="route">反応順</option></select></label><label>ID・名前<input id="query" placeholder="座位・微笑み・283"></label><label>指摘の種類<select id="code"><option value="all">すべて</option></select></label></section><div class="workspace"><aside><p id="listCount"></p><div id="list"></div></aside><section><h2 id="title"></h2><div class="controls"><label>動作<select id="stage"></select></label><button id="play">再生</button><button id="step">1コマ進める</button><label><input id="overlay" type="checkbox" checked>登録位置・検査領域</label></div><label><input id="zoom" type="checkbox">顔・首を拡大</label><p id="position" role="status"></p><div class="compare"><figure><figcaption>同じ動作の先頭コマ</figcaption><canvas id="before" width="320" height="480"></canvas></figure><figure><figcaption>検査コマ</figcaption><canvas id="after" width="320" height="480"></canvas></figure></div><p>緑：目、赤：口、橙：顔周辺。線と領域は停止コマの登録位置で、各コマで追跡した骨格ではありません。</p><div id="findings"></div><pre id="metrics"></pre><label>目視確認メモ<textarea id="note" rows="3"></textarea></label><div class="controls"><button id="reviewed">目視確認した</button><button id="needsFix">修正が必要</button><button id="unchecked">未確認に戻す</button><span id="reviewState"></span><button id="save">確認記録を保存</button></div><p id="status" role="status"></p></section></div><details><summary>検査条件・判定の限界</summary><pre id="thresholds"></pre><p>領域内の変化は輪郭重心による平行移動補正後に比較。縮尺は明るい輪郭の0.5〜99.5パーセンタイル高。顔と胴体は指定領域の画素重心の相対差。実際の関節、腕の本数、首の形や口の正解位置を画像から理解しているわけではありません。隣接IDの人工的な姿勢切替と、本番の反応順は区別します。</p><p>JSON・CSVと、このフォルダーの親にある連続画像を一緒に保管してください。検品だけで画像・アプリの変更は行いません。</p></details></main><script src="audit-data.js"></script><script src="audit.js"></script></body></html>
