<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロキ 動作の検品</title><link rel="stylesheet" href="review.css"><body><header><h1>ロキ 動作の検品</h1><p id="provenance"></p><p>グラスの描画処理から保存した連続画像です。元画像をブラウザで変形していません。</p></header><main><section class="controls"><label>絞り込み<input id="filter" placeholder="ID・座位・表情名"></label><label>種類<select id="kind"><option value="all">全身と顔</option><option value="body">全身</option><option value="face">顔</option><option value="route">会話の反応順</option></select></label><button id="prevPose">前の画像</button><select id="pose" aria-label="確認する画像"></select><button id="nextPose">次の画像</button></section><section class="controls"><label>確認する動作<select id="stage"><option value="still">停止</option><option value="idle">待機・呼吸</option><option value="speech">発話・口</option><option value="blink">まばたき</option><option value="transition">ポーズ切り替え</option></select></label><button id="play">一時停止</button><button id="step">1コマ進む</button><label>速度<select id="speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option></select></label><label><input id="focus" type="checkbox">顔・首を拡大</label></section><p id="status" role="status"></p><p id="transitionInfo"></p><section class="compare"><figure><figcaption id="leftLabel">基準：同じ画像の停止状態</figcaption><canvas id="left" width="320" height="480"></canvas></figure><figure><figcaption id="rightLabel">現在</figcaption><canvas id="right" width="320" height="480"></canvas></figure></section><section class="controls"><label>以前の検品フォルダーを比較元にする<input id="baseline" type="file" webkitdirectory multiple></label><button id="clearBaseline">停止状態との比較に戻す</button></section><p>通常画像の切り替えは隣接IDとの比較です。「会話の反応順」は本番の反応ポリシーの順番・時間で描画したコマです。会話入力・読み込み待ち・前後の補間を含めた全経路の再現ではありません。</p><section><h2>確認記録</h2><div class="controls"><button data-result="pass">この画像は確認済み</button><button data-result="fix">要修正</button><button data-result="unchecked">未確認へ戻す</button><span id="result"></span></div><label>気になる箇所<textarea id="note" rows="2" placeholder="例：発話中、口が上へ浮く"></textarea></label><button id="export">確認記録を保存</button><p>記録はこのブラウザ内に保存します。アプリの画像や会話は変更しません。</p></section></main><script src="manifest.js"></script><script src="review.js"></script></body></html>
