plugins { id 'com.android.application' }
android {
 namespace 'com.example.lokihealbe'
 compileSdk 35
 defaultConfig { applicationId 'com.example.lokihealbe'; testInstrumentationRunner 'com.example.lokihealbe.SyncAudit'; minSdk 28; targetSdk 35; versionCode 4; versionName '0.1.2-fresh-device-summary' }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES']; merges += ['META-INF/LICENSE*','META-INF/NOTICE*'] } }
}
dependencies { implementation 'com.healbe:healbesdk:1.11.0'; implementation 'io.reactivex.rxjava2:rxjava:2.2.21'; coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2' }
